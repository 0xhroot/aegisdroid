[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aegisdroid"
version = "1.0.0"
description = "Advanced Android Security, Threat Hunting & Digital Forensics Framework"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "AegisDroid Contributors" },
]
keywords = [
    "android", "security", "forensics", "dfir", "threat-hunting",
    "malware-analysis", "apk-analysis", "yara", "adb", "cybersecurity",
    "incident-response", "digital-forensics", "mobile-security",
    "reverse-engineering", "cli", "terminal", "python",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "textual>=0.60.0",
    "prompt_toolkit>=3.0.43",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "aiosqlite>=0.19.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
    "lxml>=5.1.0",
    "python-magic>=0.4.27",
    "tqdm>=4.66.0",
    "gitpython>=3.1.41",
    "semver>=3.0.2",
    "packaging>=24.0",
    "jinja2>=3.1.3",
    "markdown>=3.5.0",
    "tabulate>=0.9.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-xdist>=3.5.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]
ai = [
    "ollama>=0.4.0",
    "openai>=1.12.0",
]
apk = [
    "androguard>=4.0",
    "yara-python>=4.3.0",
    "capstone>=5.0.0",
    "pefile>=2023.2.7",
]
all = ["aegisdroid[dev,ai,apk]"]

[project.scripts]
aegis = "aegisdroid.cli.menu:main"
aegisdroid = "aegisdroid.cli.menu:main"

[project.urls]
Homepage = "https://github.com/0xhroot/aegisdroid"
Documentation = "https://github.com/0xhroot/aegisdroid#readme"
Repository = "https://github.com/0xhroot/aegisdroid"
Issues = "https://github.com/0xhroot/aegisdroid/issues"
Changelog = "https://github.com/0xhroot/aegisdroid/blob/main/CHANGELOG.md"
Security = "https://github.com/0xhroot/aegisdroid/blob/main/SECURITY.md"

[project.entry-points."aegisdroid.plugins"]
# Plugins register here via entry points

[tool.hatch.build.targets.wheel]
packages = ["aegisdroid"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["aegisdroid", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "S", "B", "A", "COM", "C4", "DTZ",
    "ISC", "ICN", "PIE", "PT", "RSE", "RET", "SLF", "SIM", "TID", "TCH",
    "ARG", "PTH", "ERA", "PD", "PLC", "PLE", "PLR", "PLW", "TRY",
    "RUF", "PERF", "FURB", "LOG", "G", "INP", "T20",
]
ignore = [
    "COM812", "ISC001",
    "PLC0415",
    "DTZ005", "DTZ007", "DTZ001",
    "S101", "S108", "S110", "S324", "S603", "S605", "S104",
    "PLR2004", "PLR0912", "PLR0915", "PLR0911", "PLR0913",
    "PERF401",
    "TRY400", "TRY003", "TRY301", "TRY300", "TRY401",
    "RET504", "RET505",
    "SIM105", "SIM102",
    "B007",
    "A002",
    "N806",
    "SLF001",
    "ARG001", "ARG002",
    "RUF012", "RUF022", "RUF021", "RUF005", "RUF059",
    "FURB171", "FURB110",
    "INP001", "T201",
    "PLW1510", "PLW3301", "PLW2901",
    "PTH123", "PTH108",
    "UP032", "UP045",
    "C416",
    "F841",
    "E501",
    "E741",
]

[tool.ruff.lint.isort]
known-first-party = ["aegisdroid"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "yara.*",
    "androguard.*",
    "capstone.*",
    "magic.*",
    "textual.*",
    "prompt_toolkit.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_device: marks tests that need a connected Android device",
    "requires_root: marks tests that need root access",
]

[tool.coverage.run]
source = ["aegisdroid"]
omit = ["*/tests/*", "*/rust/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
    "pass",
]
